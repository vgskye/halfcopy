[package]
name = "halfcopy"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/vgskye/halfcopy"

[dependencies]
anyhow = "1.0.100"
async-walkdir = "2.1.0"
blake3 = { version = "1.8.2", features = ["traits-preview"] }
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.48", features = ["derive"] }
console = "0.16.1"
dashmap = "6.1.0"
futures-util = { version = "0.3.31", features = ["futures-sink"] }
hex = "0.4.3"
hkdf = "0.12.4"
indicatif = "0.18.0"
iroh = "0.92.0"
iroh-base = "0.92.0"
iroh-blobs = "0.94.0"
itertools = "0.14.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.8.5"
serde = { version = "1.0.226", features = ["derive"] }
spake2 = { version = "0.4.0", features = ["std"] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.27.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
